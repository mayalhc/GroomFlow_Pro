# 사이트 설정
site_name: GroomFlow_Pro Guide
site_url: https://github.io
site_author: chamiseul

# 문서 소스 폴더 경로
docs_dir: 'docs'

# 테마 설정 (기존 ReadTheDocs 스타일 유지)
theme:
  name: readthedocs
  highlightjs: true
  collapse_navigation: false  # 네비게이션 전체를 항상 펼침
  sticky_navigation: true
  navigation_depth: 4
  titles_only: false

# 마크다운 확장 기능
markdown_extensions:
  - admonition
  - tables
  - footnotes
  - attr_list
  - def_list

# 사이트 메뉴 및 목차 구조
nav:
  - GroomFlow_Pro Guide: index.md
  # - "Go to GroomForge Wiki": integration.md

# 플러그인 설정
plugins:
  - search
